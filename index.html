<head>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        .dark-bg { background-color: #0a0a0c; }
        .accent-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

<script type="importmap">
{
  "imports": {
    "express": "https://esm.sh/express@^5.2.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "mongoose": "https://esm.sh/mongoose@^9.2.1",
    "jsonwebtoken": "https://esm.sh/jsonwebtoken@^9.0.3",
    "cors": "https://esm.sh/cors@^2.8.6",

    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",

</head>
<body class="dark-bg text-gray-100 min-h-screen">
    <div id="root"></div>
    <script>
        /**
         * Robust Service Worker Registration
         * Fixes 'URL' constructor errors in sandboxed or preview environments.
         */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Register using a relative string directly to avoid URL parsing issues in some browser environments
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('MeetMet Service Worker registered successfully');
                    })
                    .catch(err => {
                        // Handle common failures in sandboxed/preview environments gracefully
                        if (err.name === 'SecurityError' || err.message.includes('origin') || err.message.includes('URL')) {
                            console.warn('PWA: Service Worker registration skipped (expected behavior in cross-origin preview or insecure context).');
                        } else {
                            console.error('PWA: Service Worker registration failed:', err);
                        }
                    });
            });
        }
    </script>
</body>
